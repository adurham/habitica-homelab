name: Build & Push to GHCR

on:
  push:
    branches:
      - self-host-local
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/habitica-server:latest
            ghcr.io/${{ github.repository_owner }}/habitica-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted Habitica server (homelab fork)
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/habitica-server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/habitica-server:buildcache,mode=max
